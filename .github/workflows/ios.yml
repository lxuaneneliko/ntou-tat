name: iOS build and tests
on:
  push:
    branches: [main, 'feat/ios-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: Native mail parser and safety tests
        run: swift test --package-path ios/App/NtouNative
      - name: Compile and link iPhone simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build | tee ios-simulator-build.log
      - name: Launch simulator smoke test
        run: |
          DEVICE=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(d=>d.name.startsWith("iPhone"));if(!d)process.exit(1);process.stdout.write(d.udid)})')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" DerivedData/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.lxuan.ntoutat
          sleep 10
          xcrun simctl io "$DEVICE" screenshot ios-launch.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep com.lxuan.ntoutat
      - name: Create unsigned device archive (not an installable IPA)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath output/NTOUTAT-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive | tee ios-device-build.log
      - name: Upload build evidence and unsigned archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: |
            ios-*-build.log
            ios-launch.png
            output/NTOUTAT-unsigned.xcarchive
            ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 14
