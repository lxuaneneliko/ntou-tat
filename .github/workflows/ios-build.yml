name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/ios-port
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'public/**'
      - 'scripts/fix-ios-package-paths.mjs'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'public/**'
      - 'scripts/fix-ios-package-paths.mjs'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Sync iOS project
        run: npm run ios:sync

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/App.app ntou-tat-ios-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ntou-tat-ios-simulator
          path: ntou-tat-ios-simulator.zip
          if-no-files-found: error
